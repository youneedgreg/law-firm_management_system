name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Runs before install so a broken lock reports the actual cause rather
      # than npm ci's wall of usage text.
      - name: Check lockfile is complete
        run: npm run check:lockfile

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # With coverage, because the thresholds in vitest.config.ts are the floor
      # the README's badge claims. Measuring it only locally would make the
      # badge an assertion nothing checks (ADR 0014). The pre-push hook still
      # runs the plain suite — the instrumentation costs a few seconds, and the
      # gate that matters is this one.
      - name: Unit tests, with coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Docker is available on ubuntu-latest, so Testcontainers works natively.
    # Skipped until Phase 2 writes the first *.integration.test.ts file.
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration
        env:
          # The seed refuses to run outside the demonstration (D-11), and these
          # specs run the real seed against a throwaway container. Set here so
          # that turning this job on is one `if:` rather than an afternoon
          # reading a refusal that is working correctly.
          DEMO_DEPLOYMENT: "true"

  e2e:
    name: End-to-end (browser, real database)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Off until a database is wired to CI, and that is a decision rather than
    # an omission. These specs drive the real application against the real
    # Postgres and *write* to it: a matter is opened, hours are recorded, a fee
    # note is raised and paid. Pointing them at the deployment's own database
    # from CI would put a run's debris in front of whoever opened the demo,
    # which is tolerable when a person runs `npm run test:e2e` and watches the
    # sweep report, and is not when a push does it unattended.
    #
    # To turn on: give the job a `DATABASE_URL` for a Neon *branch* of its own
    # — which is a click, and is what preview environments should have anyway
    # (Phase 2 records the shared database as deliberate at portfolio scale and
    # per-preview branches as the obvious upgrade). Nothing in the specs
    # changes; `sweep.ts` already assumes it may be running after a crash.
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          # The specs sign in through the one-click switcher, which refuses
          # outside the demonstration (D-11).
          DEMO_DEPLOYMENT: "true"
